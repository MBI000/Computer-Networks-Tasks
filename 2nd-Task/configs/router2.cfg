! Router2 (PT8200): gateway for both LANs
! Paste into Router2 -> CLI after pressing Enter at the prompt.
! Gi0/0/0 faces Switch0 and Gi0/0/1 faces Switch1. Swap them if your cables differ.
enable
configure terminal
hostname Router2
!
interface gigabitEthernet 0/0/0
 description LAN-Switch0
 ip address 192.168.10.1 255.255.255.0
 no shutdown
 exit
!
interface gigabitEthernet 0/0/1
 description LAN-Switch1
 ip address 192.168.20.1 255.255.255.0
 no shutdown
 end
!
! Save so the configuration survives a reload
copy running-config startup-config
